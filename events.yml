name: Collect RESCENE Collab Popup Events

# 6시간마다 콜라보·팝업 소식 수집 (X 조회 비용 때문에 자주 돌리지 않음)
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  events:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 콜라보·팝업 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python event_collector.py

      - name: 사이트 데이터 빌드
        run: python build_site_data.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "rescene-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rescene_tracker.db docs/data.js
          git diff --quiet --cached || git commit -m "auto: collab/popup events ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase -X ours || (git rebase --abort; git fetch origin main; git reset --hard origin/main)
          python build_site_data.py
          git add rescene_tracker.db docs/data.js
          git diff --quiet --cached || git commit -m "auto: collab/popup events [retry]"
          git push
