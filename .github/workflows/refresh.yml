name: Refresh RESCENE Tracker Data

# 30분마다 자동 실행 + 수동 실행(Actions 탭에서 Run workflow) 둘 다 지원
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# data.js / DB를 저장소에 다시 커밋하려면 쓰기 권한이 필요합니다
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 유튜브·뉴스 수집
        run: python collector.py

      - name: 차트 조회
        run: python chart_tracker.py

      - name: 팬 반응(유튜브 댓글) 수집
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python fan_reactions.py

      - name: 사이트 데이터 빌드
        run: python build_site_data.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "rescene-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rescene_tracker.db docs/data.js
          git diff --quiet --cached || git commit -m "auto: refresh data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # 다른 워크플로(공식 스케줄 수집 등)가 그 사이 먼저 push했을 수 있어
          # 항상 pull 먼저 시도하고, DB 충돌 시엔 방금 만든 내 결과를 우선함
          # (어차피 수집은 누적/멱등이라 다음 주기에 서로의 데이터가 다시 채워짐)
          git pull --rebase -X ours || (git rebase --abort; git fetch origin main; git reset --hard origin/main)
          python build_site_data.py
          git add rescene_tracker.db docs/data.js
          git diff --quiet --cached || git commit -m "auto: refresh data ($(date -u +'%Y-%m-%d %H:%M UTC')) [retry]"
          git push
