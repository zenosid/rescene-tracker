name: Refresh Official Schedule (Mnet Plus)

# 뉴스/차트보다 낮은 빈도(6시간마다)로 실행 - 공식 일정은 자주 안 바뀌고,
# Playwright(브라우저 자동화)가 설치 시간이 오래 걸려서 Actions 무료 실행
# 시간을 아끼기 위해 별도 워크플로로 분리했습니다.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        run: python -m playwright install --with-deps chromium

      - name: 공식 스케줄(Mnet Plus) 수집
        run: python official_schedule.py

      - name: 플로 차트 수집
        run: python flo_chart.py

      - name: 사이트 데이터 빌드
        run: python build_site_data.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "rescene-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rescene_tracker.db docs/data.js
          git diff --quiet --cached || git commit -m "auto: refresh official schedule ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase -X ours || (git rebase --abort; git fetch origin main; git reset --hard origin/main)
          python build_site_data.py
          git add rescene_tracker.db docs/data.js
          git diff --quiet --cached || git commit -m "auto: refresh official schedule ($(date -u +'%Y-%m-%d %H:%M UTC')) [retry]"
          git push
